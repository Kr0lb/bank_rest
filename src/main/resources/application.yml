jwt:
  secret-key: ${JWT_SECRET:secret}
  refresh_token_life: 60
  access_token_life: 720000

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: bankcards-service
  datasource:
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: none
  liquibase:
    change-log: db/db.changelog-master.yaml